apis:
- aid: pragmatic:customer-portal-api
  name: Pragmatic Customer Portal API
  description: >-
    The first-party JSON API behind portal.pragmaticsemi.com, the Pragmatic Customer Portal.
    Discovered by reading the portal's own published JavaScript bundle, which sets
    REACT_APP_BASE_URL to https://api-portal.pragmaticsemi.com/ and REACT_APP_SOCKET_URL to
    wss://api-portal.pragmaticsemi.com/ws/. The host is live and answers JSON (gunicorn,
    Django REST Framework style envelopes), and https://api-portal.pragmaticsemi.com/v1/auth/login/
    returns 405 Method Not Allowed to a GET, confirming a versioned /v1/ surface. Pragmatic
    publishes no OpenAPI, no reference documentation and no developer portal for it - every
    route requires an authenticated customer session, so this entry records a measured surface,
    not a published contract.
  humanURL: https://portal.pragmaticsemi.com/
  baseURL: https://api-portal.pragmaticsemi.com/v1/
  tags:
  - Customer Portal
  - Authentication
  - Orders
  x-contract: none-published
  x-discovery: portal-javascript-bundle
