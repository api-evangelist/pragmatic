aid: pragmatic
name: Pragmatic
description: >-
  Pragmatic Semiconductor Limited is a UK semiconductor manufacturer that designs and
  produces FlexICs - ultra-thin, physically flexible integrated circuits built on thin-film
  transistor (TFT) technology rather than conventional crystalline silicon. Founded in 2010
  by Richard Price and Scott White and headquartered at Cambridge Science Park with
  manufacturing at Pragmatic Park in Sedgefield, County Durham, the company operates the
  Pragmatic FlexIC Foundry, a service that takes third-party custom flexible IC designs from
  tape-out to delivery in roughly six weeks. Product lines include the FlexIC Platform Gen 3
  mixed-signal flexible ASIC design flow, Pragmatic NFC Connect and Pragmatic NFC Protect.
  The company raised a $231M Series D in 2023. Its only network-reachable API surface is the
  undocumented, authentication-gated backend of its customer portal; it publishes no
  developer program, no machine-readable contract and no public API reference.
